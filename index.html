<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noval Consultancy | Responsible AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-forest: #1B4332;
    --emerald: #2D6A4F;
    --sage: #52B788;
    --mint: #D8F3DC;
    --warm-gold: #B68D40;
    --gold-light: #D4A853;
    --off-white: #F8F9FA;
    --light-grey: #E9ECEF;
    --text-primary: #1B1B1B;
    --text-secondary: #555;
    --text-muted: #888;
    --font-heading: 'DM Serif Display', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); color: var(--text-primary); background: #fff; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 60px; background: white; border-bottom: 1px solid var(--light-grey); position: sticky; top: 0; z-index: 999; }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--deep-forest); }
  .nav-logo img { width: 40px; height: 40px; object-fit: contain; }
  .nav-logo span { font-family: var(--font-heading); font-size: 24px; }
  .logo-invert { filter: brightness(0) invert(1); }
  .nav-links { display: flex; gap: 36px; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--text-secondary); font-size: 15px; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: var(--deep-forest); }
  .btn { display: inline-block; padding: 12px 28px; border-radius: 6px; font-weight: 600; font-size: 15px; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; }
  .btn-primary { background: var(--deep-forest); color: white; }
  .btn-primary:hover { background: var(--emerald); }
  .btn-outline { background: transparent; color: var(--deep-forest); border: 2px solid var(--deep-forest); }
  .btn-outline:hover { background: var(--deep-forest); color: white; }
  .btn-gold { background: var(--warm-gold); color: white; }
  .btn-gold:hover { background: var(--gold-light); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; min-height: 580px; overflow: hidden; }
  .hero-content { display: flex; flex-direction: column; justify-content: center; padding: 80px 60px; }
  .hero-label { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--warm-gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
  .hero h1 { font-family: var(--font-heading); font-size: 48px; line-height: 1.15; color: var(--deep-forest); margin-bottom: 24px; }
  .hero p { font-size: 18px; line-height: 1.65; color: var(--text-secondary); margin-bottom: 36px; max-width: 520px; }
  .hero-buttons { display: flex; gap: 16px; }
  .hero-image { position: relative; background: url("noval-cove-colour.jpg"); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .trust-bar { background: var(--off-white); padding: 28px 60px; display: flex; align-items: center; justify-content: center; gap: 50px; border-top: 1px solid var(--light-grey); border-bottom: 1px solid var(--light-grey); }
  .trust-bar .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; white-space: nowrap; }
  .trust-item { font-size: 14px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .trust-item .number { font-family: var(--font-heading); font-size: 28px; color: var(--deep-forest); }
  .services { padding: 100px 60px; max-width: 1200px; margin: 0 auto; }
  .section-label { font-family: var(--font-mono); font-size: 12px; color: var(--warm-gold); text-transform: uppercase; letter-spacing: 2.5px; font-weight: 500; margin-bottom: 12px; }
  .section-title { font-family: var(--font-heading); font-size: 38px; color: var(--deep-forest); margin-bottom: 16px; }
  .section-subtitle { font-size: 17px; color: var(--text-secondary); line-height: 1.6; max-width: 600px; margin-bottom: 50px; }
  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .service-card { background: var(--off-white); border-radius: 12px; padding: 36px 30px; transition: all 0.3s; border: 1px solid transparent; }
  .service-card:hover { border-color: var(--mint); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(27, 67, 50, 0.08); }
  .service-icon { width: 52px; height: 52px; border-radius: 10px; background: var(--deep-forest); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
