<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noval Icon Preview</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;font-family:-apple-system,sans-serif;gap:60px}
.box{text-align:center}
.box p{margin-top:12px;font-size:13px;color:#888}
.light{background:#fff;padding:40px;border-radius:16px;border:1px solid #e0e0e0}
.dark{background:#1B4332;padding:40px;border-radius:16px}
img.icon{width:150px;height:150px;object-fit:contain}
</style>
</head>
<body>

<div class="box">
  <div class="light">
    <img src="noval-icon.svg" class="icon" alt="SVG trace">
  </div>
  <p>SVG — on light</p>
</div>

<div class="box">
  <div class="dark">
    <img src="noval-icon.svg" class="icon" alt="SVG trace" style="filter:brightness(0) invert(1)">
  </div>
  <p>SVG trace — on dark</p>
</div>

<div class="box">
  <div class="light">
    <img src="../noval-icon.png" class="icon" alt="Original PNG">
  </div>
  <p>Original PNG — for comparison</p>
</div>

</body>
</html>
